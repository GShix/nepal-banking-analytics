services:
  banking-analytics-app:
    build: .
    container_name: nepal_banking_analytics
    ports:
      - "8501:8501"
    volumes:
      # Mounting directories enables live code hot-reloading during review
      - ./app:/app/app
      - ./src:/app/src
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped